name: Deploy Paymo API to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-paymo-api.yml'

jobs:
  deploy-paymo-api:
    runs-on: ubuntu-slim
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out Paymo
        uses: actions/checkout@v4
        with:
          repository: tetotraining/teto-paymo
          ref: main
          path: paymo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Paymo dependencies
        working-directory: paymo/app
        run: npm install
      - name: Resolve or create Paymo D1
        working-directory: paymo/app
        shell: bash
        run: |
          set -e
          npx wrangler d1 list --json > /tmp/paymo-d1-list.json
          DB_ID="$(node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/paymo-d1-list.json','utf8'));const x=a.find(v=>v.name==='paymo');process.stdout.write(x?.uuid||x?.id||'')")"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create paymo --location apac
            npx wrangler d1 list --json > /tmp/paymo-d1-list.json
            DB_ID="$(node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/paymo-d1-list.json','utf8'));const x=a.find(v=>v.name==='paymo');process.stdout.write(x?.uuid||x?.id||'')")"
          fi
          test -n "$DB_ID"
          node - "$DB_ID" <<'NODE'
          const fs = require('fs');
          const id = process.argv[2];
          fs.writeFileSync('wrangler.paymo-api.jsonc', JSON.stringify({
            name: 'paymo-api',
            main: 'worker/account-api-v2.js',
            compatibility_date: '2026-10-01',
            observability: { logs: { enabled: true, invocation_logs: true } },
            triggers: { crons: ['0 * * * *'] },
            d1_databases: [{
              binding: 'DB',
              database_name: 'paymo',
              database_id: id,
              migrations_dir: 'migrations'
            }]
          }, null, 2));
          NODE
          echo "Paymo D1 resolved."
      - name: Apply Paymo D1 migrations
        working-directory: paymo/app
        run: npx wrangler d1 migrations apply paymo --remote --config wrangler.paymo-api.jsonc
      - name: Deploy Paymo API Worker with notification cron
        working-directory: paymo/app
        run: npx wrangler deploy --config wrangler.paymo-api.jsonc
      - name: Ensure Paymo VAPID keys
        working-directory: paymo/app
        shell: bash
        run: |
          set -e
          npx wrangler secret list --config wrangler.paymo-api.jsonc > /tmp/paymo-secrets.txt
          npx wrangler d1 execute paymo --remote --config wrangler.paymo-api.jsonc --command "SELECT value FROM system_config WHERE key='vapid_public_key';" --json > /tmp/paymo-vapid-row.json
          PUBLIC_PRESENT="$(node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/paymo-vapid-row.json','utf8'));
          function find(v){
            if(!v)return '';
            if(Array.isArray(v)){for(const x of v){const r=find(x);if(r)return r}return ''}
            if(typeof v==='object'){
              if(typeof v.value==='string'&&v.value)return v.value;
              for(const x of Object.values(v)){const r=find(x);if(r)return r}
            }
            return '';
          }
          process.stdout.write(find(data));
          NODE
          )"
          if ! grep -q 'VAPID_PRIVATE_KEY' /tmp/paymo-secrets.txt || [ -z "$PUBLIC_PRESENT" ]; then
            node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const ecdh=crypto.createECDH('prime256v1');
          ecdh.generateKeys();
          fs.writeFileSync('/tmp/paymo-vapid-public',ecdh.getPublicKey().toString('base64url'));
          fs.writeFileSync('/tmp/paymo-vapid-private',ecdh.getPrivateKey().toString('base64url'));
          NODE
            printf '%s' "$(cat /tmp/paymo-vapid-private)" | npx wrangler secret put VAPID_PRIVATE_KEY --config wrangler.paymo-api.jsonc
            PUBLIC_KEY="$(cat /tmp/paymo-vapid-public)"
            npx wrangler d1 execute paymo --remote --config wrangler.paymo-api.jsonc --command "INSERT INTO system_config(key,value) VALUES('vapid_public_key','$PUBLIC_KEY') ON CONFLICT(key) DO UPDATE SET value=excluded.value;"
            rm -f /tmp/paymo-vapid-public /tmp/paymo-vapid-private
            echo "Paymo VAPID keys configured."
          else
            echo "Paymo VAPID keys already configured."
          fi
      - name: Verify Paymo API authentication guards
        shell: bash
        run: |
          set -e
          for i in $(seq 1 12); do
            me_status="$(curl -sS -o /tmp/paymo-api-me.json -w '%{http_code}' https://paymo-api.teto-training.workers.dev/api/me || true)"
            delete_status="$(curl -sS -X DELETE -o /tmp/paymo-api-delete.json -w '%{http_code}' https://paymo-api.teto-training.workers.dev/api/account || true)"
            notification_status="$(curl -sS -o /tmp/paymo-api-notification.json -w '%{http_code}' https://paymo-api.teto-training.workers.dev/api/notification-settings || true)"
            echo "attempt=$i me=$me_status delete=$delete_status notification=$notification_status"
            if [ "$me_status" = "401" ] && [ "$delete_status" = "401" ] && [ "$notification_status" = "401" ]; then
              cat /tmp/paymo-api-me.json
              cat /tmp/paymo-api-delete.json
              cat /tmp/paymo-api-notification.json
              exit 0
            fi
            sleep 3
          done
          cat /tmp/paymo-api-me.json || true
          cat /tmp/paymo-api-delete.json || true
          cat /tmp/paymo-api-notification.json || true
          exit 1
