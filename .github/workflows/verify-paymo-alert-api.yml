name: Verify Paymo alert settings production API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-paymo-alert-api.yml'
jobs:
  safe-account-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real save and reload using temporary Paymo account, then delete it
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { randomUUID } from 'node:crypto';
          const base = 'https://teto-paymo.pages.dev';
          const identifier = 'paymo-smoke-' + randomUUID().replaceAll('-', '').slice(0, 20);
          const password = randomUUID();
          let token = '';
          async function request(path, method = 'GET', data = undefined) {
            const response = await fetch(base + path, {
              method,
              headers: {
                'content-type': 'application/json',
                ...(token ? { authorization: 'Bearer ' + token } : {})
              },
              body: data === undefined ? undefined : JSON.stringify(data)
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok) throw Error(method + ' ' + path + ': HTTP ' + response.status + ' (' + (result.error || 'unknown') + ')');
            return { response, result };
          }
          const reg = await request('/api/register', 'POST', {
            nickname: 'Paymo API確認用',
            loginId: identifier,
            password
          });
          token = reg.result.token;
          assert.equal(typeof token, 'string', 'registration should return an auth token');
          let successful = false;
          try {
            const one = await request('/api/spending-threshold-settings');
            assert.equal(one.response.headers.get('x-paymo-spending-threshold-api'), '1', 'updated API deployed');
            assert.deepEqual(
              { threshold: one.result.settings?.threshold, enabled: one.result.settings?.enabled },
              { threshold: 30000, enabled: true },
              '¥30,000 and ON initial settings'
            );
            const save = await request('/api/spending-threshold-settings', 'POST', { threshold: 50000, enabled: true });
            assert.equal(save.result.settings?.threshold, 50000);
            const persisted = await request('/api/spending-threshold-settings');
            assert.equal(persisted.result.settings?.threshold, 50000, '¥50,000 persisted on server');
            assert.equal(persisted.result.settings?.enabled, true, 'ON persisted on server');
            const off = await request('/api/spending-threshold-settings', 'POST', { threshold: 65000, enabled: false });
            assert.equal(off.result.settings?.enabled, false, 'OFF saved');
            const reread = await request('/api/spending-threshold-settings');
            assert.equal(reread.result.settings?.threshold, 65000, 'second value persisted');
            assert.equal(reread.result.settings?.enabled, false, 'OFF persisted');
            successful = true;
            console.log('PASS: authenticated ¥30,000 default; immediate ¥50,000 save; GET persisted; edit ¥65,000 + OFF; GET persisted');
          } finally {
            await request('/api/account', 'DELETE');
            console.log('Temporary smoke test account deleted');
          }
          if (!successful) throw Error('Smoke test incomplete');
          NODE
