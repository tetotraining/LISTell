name: Deploy Paymo Pages directly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-paymo-pages.yml'

jobs:
  deploy-paymo-pages:
    runs-on: ubuntu-slim
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out Paymo
        uses: actions/checkout@v4
        with:
          repository: tetotraining/teto-paymo
          ref: main
          path: paymo
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Paymo dependencies
        working-directory: paymo/app
        run: npm install
      - name: Build Paymo
        working-directory: paymo/app
        run: npm run build
      - name: Deploy Paymo Pages with Functions
        shell: bash
        run: |
          set -e
          PAYMO_SHA="$(git -C paymo rev-parse HEAD)"
          PAYMO_MESSAGE="$(git -C paymo log -1 --pretty=%s)"
          cd paymo
          ./app/node_modules/.bin/wrangler pages deploy app/dist \
            --project-name=teto-paymo \
            --branch=main \
            --commit-hash="$PAYMO_SHA" \
            --commit-message="$PAYMO_MESSAGE"
      - name: Verify Paymo production
        shell: bash
        run: |
          set -e
          for i in $(seq 1 20); do
            ts=$(date +%s)
            html_status="$(curl -sS --max-time 10 -o /tmp/paymo-index.html -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/?ts=$ts" || true)"
            graph_edit_status="$(curl -sS --max-time 10 -o /tmp/paymo-graph-detail-edit.js -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-graph-detail-edit.js?ts=$ts" || true)"
            auth_status="$(curl -sS --max-time 10 -o /tmp/paymo-me.json -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/api/me?ts=$ts" || true)"
            echo "attempt=$i html=$html_status graph_edit=$graph_edit_status auth=$auth_status"
            if [ "$html_status" = "200" ] \
              && [ "$graph_edit_status" = "200" ] \
              && [ "$auth_status" = "401" ] \
              && grep -Fq "window.paymoOpenHistoryEditor(id);" /tmp/paymo-graph-detail-edit.js \
              && grep -Fq "history-edit-sheet{z-index:901!important}" /tmp/paymo-graph-detail-edit.js \
              && ! grep -Fq "back.click();" /tmp/paymo-graph-detail-edit.js; then
              echo "Paymo production verified with in-place graph editor."
              exit 0
            fi
            sleep 5
          done
          echo "Paymo production verification failed."
          exit 1
