name: Deploy Paymo Pages directly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-paymo-pages.yml'

jobs:
  deploy-paymo-pages:
    runs-on: ubuntu-slim
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out Paymo
        uses: actions/checkout@v4
        with:
          repository: tetotraining/teto-paymo
          ref: main
          path: paymo
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Paymo source integrity
        shell: bash
        run: |
          set -euo pipefail
          for public_file in paymo/app/public/paymo-*.js; do
            base="$(basename "$public_file")"
            root_file="paymo/$base"
            if [ -f "$root_file" ]; then
              cmp -s "$root_file" "$public_file" || {
                echo "Mirror mismatch: $root_file <-> $public_file"
                exit 1
              }
            fi
          done
          grep -q 'primeLegacyHistoryTargets' paymo/app/public/paymo-integrity-fixes.js
          grep -q 'history-delete-confirm-backdrop{z-index:950' paymo/app/public/paymo-integrity-fixes.js
          grep -q 'paymo-expenses-updated' paymo/app/public/paymo-integrity-fixes.js
          grep -q 'bulk-delete' paymo/app/public/paymo-integrity-fixes.js
          grep -q 'authorization' paymo/app/public/paymo-integrity-fixes.js
          grep -q 'sameAmountAndDate' paymo/app/public/paymo-integrity-fixes.js
          grep -q '/paymo-integrity-fixes.js' paymo/functions/_middleware.js
          grep -Fq "category-history-row.is-paid .category-history-amount{color:#22a559!important}" paymo/app/public/paymo-category-spend.js
          grep -Fq '/paymo-monthly-summary-notifications.js' paymo/functions/_middleware.js
          grep -Fq '/api/monthly-summary-settings' paymo/app/public/paymo-monthly-summary-notifications.js
      - name: Install Paymo dependencies
        working-directory: paymo/app
        run: npm install
      - name: Build Paymo
        working-directory: paymo/app
        run: npm run build
      - name: Deploy Paymo Pages with Functions
        shell: bash
        run: |
          set -e
          PAYMO_SHA="$(git -C paymo rev-parse HEAD)"
          PAYMO_MESSAGE="$(git -C paymo log -1 --pretty=%s)"
          cd paymo
          ./app/node_modules/.bin/wrangler pages deploy app/dist \
            --project-name=teto-paymo \
            --branch=main \
            --commit-hash="$PAYMO_SHA" \
            --commit-message="$PAYMO_MESSAGE"
      - name: Verify Paymo production
        shell: bash
        run: |
          set -euo pipefail
          expected_integrity="$(sha256sum paymo/app/public/paymo-integrity-fixes.js | awk '{print $1}')"
          expected_paid="$(sha256sum paymo/app/public/paymo-paid.js | awk '{print $1}')"
          expected_items="$(sha256sum paymo/app/public/paymo-items.js | awk '{print $1}')"
          expected_category_spend="$(sha256sum paymo/app/public/paymo-category-spend.js | awk '{print $1}')"
          expected_monthly="$(sha256sum paymo/app/public/paymo-monthly-summary-notifications.js | awk '{print $1}')"
          for i in $(seq 1 20); do
            ts=$(date +%s)
            html_status="$(curl -sS --max-time 10 -o /tmp/paymo-index.html -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/?ts=$ts" || true)"
            integrity_status="$(curl -sS --max-time 10 -o /tmp/paymo-integrity-fixes.js -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-integrity-fixes.js?ts=$ts" || true)"
            paid_status="$(curl -sS --max-time 10 -o /tmp/paymo-paid.js -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-paid.js?ts=$ts" || true)"
            items_status="$(curl -sS --max-time 10 -o /tmp/paymo-items.js -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-items.js?ts=$ts" || true)"
            category_spend_status="$(curl -sS --max-time 10 -o /tmp/paymo-category-spend.js -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-category-spend.js?ts=$ts" || true)"
            monthly_file_status="$(curl -sS --max-time 10 -o /tmp/paymo-monthly-summary-notifications.js -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-monthly-summary-notifications.js?ts=$ts" || true)"
            auth_status="$(curl -sS --max-time 10 -o /tmp/paymo-me.json -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/api/me?ts=$ts" || true)"
            monthly_api_status="$(curl -sS --max-time 10 -o /tmp/paymo-monthly-api.json -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/api/monthly-summary-settings?ts=$ts" || true)"
            echo "attempt=$i html=$html_status integrity=$integrity_status paid=$paid_status items=$items_status category_spend=$category_spend_status monthly_file=$monthly_file_status auth=$auth_status monthly_api=$monthly_api_status"
            if [ "$html_status" = "200" ] \
              && [ "$integrity_status" = "200" ] \
              && [ "$paid_status" = "200" ] \
              && [ "$items_status" = "200" ] \
              && [ "$category_spend_status" = "200" ] \
              && [ "$monthly_file_status" = "200" ] \
              && [ "$auth_status" = "401" ] \
              && [ "$monthly_api_status" = "401" ] \
              && [ "$(sha256sum /tmp/paymo-integrity-fixes.js | awk '{print $1}')" = "$expected_integrity" ] \
              && [ "$(sha256sum /tmp/paymo-paid.js | awk '{print $1}')" = "$expected_paid" ] \
              && [ "$(sha256sum /tmp/paymo-items.js | awk '{print $1}')" = "$expected_items" ] \
              && [ "$(sha256sum /tmp/paymo-category-spend.js | awk '{print $1}')" = "$expected_category_spend" ] \
              && [ "$(sha256sum /tmp/paymo-monthly-summary-notifications.js | awk '{print $1}')" = "$expected_monthly" ] \
              && grep -Fq '/paymo-integrity-fixes.js' /tmp/paymo-index.html \
              && grep -Fq '/paymo-monthly-summary-notifications.js' /tmp/paymo-index.html \
              && grep -Fq 'paymoIntegrityStatus' /tmp/paymo-integrity-fixes.js \
              && grep -Fq 'primeLegacyHistoryTargets' /tmp/paymo-integrity-fixes.js \
              && grep -Fq 'history-delete-confirm-backdrop{z-index:950' /tmp/paymo-integrity-fixes.js \
              && grep -Fq 'sameAmountAndDate' /tmp/paymo-integrity-fixes.js \
              && grep -Fq 'overdueItems' /tmp/paymo-paid.js \
              && grep -Fq "category-history-row.is-paid .category-history-amount{color:#22a559!important}" /tmp/paymo-category-spend.js \
              && grep -Fq 'paymoMonthlySummaryEnabled' /tmp/paymo-monthly-summary-notifications.js; then
              echo "Paymo production verified with monthly summary notification settings."
              exit 0
            fi
            sleep 5
          done
          echo "Paymo production verification failed."
          exit 1
