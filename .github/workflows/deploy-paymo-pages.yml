name: Deploy Paymo Pages directly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-paymo-pages.yml'

jobs:
  deploy-paymo-pages:
    runs-on: ubuntu-slim
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out Paymo
        uses: actions/checkout@v4
        with:
          repository: tetotraining/teto-paymo
          ref: main
          path: paymo
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Paymo source integrity
        shell: bash
        run: |
          set -euo pipefail
          for public_file in paymo/app/public/paymo-*.js; do
            base="$(basename "$public_file")"
            root_file="paymo/$base"
            if [ -f "$root_file" ]; then
              cmp -s "$root_file" "$public_file" || {
                echo "Mirror mismatch: $root_file <-> $public_file"
                exit 1
              }
            fi
          done
          grep -q 'primeLegacyHistoryTargets' paymo/app/public/paymo-integrity-fixes.js
          grep -q 'history-delete-confirm-backdrop{z-index:950' paymo/app/public/paymo-integrity-fixes.js
          grep -q 'paymo-expenses-updated' paymo/app/public/paymo-integrity-fixes.js
          grep -q 'bulk-delete' paymo/app/public/paymo-integrity-fixes.js
          grep -q 'authorization' paymo/app/public/paymo-integrity-fixes.js
          grep -q 'sameAmountAndDate' paymo/app/public/paymo-integrity-fixes.js
          grep -q '/paymo-integrity-fixes.js' paymo/functions/_middleware.js
          grep -Fq "category-history-row.is-paid .category-history-amount{color:#22a559!important}" paymo/app/public/paymo-category-spend.js
          grep -Fq '/paymo-monthly-summary-notifications.js' paymo/functions/_middleware.js
          grep -Fq '/api/monthly-summary-settings' paymo/app/public/paymo-monthly-summary-notifications.js
          node --check paymo/app/public/paymo-graph-detail.js
          node --check paymo/app/public/paymo-graph-detail-edit.js
          node --check paymo/app/public/paymo-graph-detail-size.js
          grep -Fq 'paymo-graph-detail-rotate-icon' paymo/app/public/paymo-graph-detail.js
          grep -Fq 'M11.8 25.4C15.2 14.1' paymo/app/public/paymo-graph-detail.js
          grep -Fq 'M52.2 38.4C49 49.8' paymo/app/public/paymo-graph-detail.js
          grep -Fq '<span>支出日</span><span>支払期日</span><span>項目名</span><span>金額</span>' paymo/app/public/paymo-graph-detail-edit.js
          grep -Fq 'grid-template-columns:48px 62px minmax(0,1fr) 94px' paymo/app/public/paymo-graph-detail-size.js
          grep -Fq 'paymoGraphDetailToggleView' paymo/app/public/paymo-graph-detail.js
          grep -Fq 'paymoGraphDetailToggleSort' paymo/app/public/paymo-graph-detail.js
          grep -Fq 'usageDateGroups' paymo/app/public/paymo-graph-detail.js
          grep -Fq 'dateGrouped' paymo/app/public/paymo-graph-detail-edit.js
          grep -Fq 'overscroll-behavior-y:none' paymo/app/public/paymo-mobile-ui.js
          grep -Fq 'overflow:hidden!important' paymo/app/public/paymo-mobile-ui.js
          grep -Fq "const scroller = document.querySelector('.app')" paymo/app/public/paymo-nav-scroll-top.js
      - name: Install Paymo dependencies
        working-directory: paymo/app
        run: npm install
      - name: Build Paymo
        working-directory: paymo/app
        run: npm run build
      - name: Deploy Paymo Pages with Functions
        shell: bash
        run: |
          set -e
          PAYMO_SHA="$(git -C paymo rev-parse HEAD)"
          PAYMO_MESSAGE="$(git -C paymo log -1 --pretty=%s)"
          cd paymo
          ./app/node_modules/.bin/wrangler pages deploy app/dist \
            --project-name=teto-paymo \
            --branch=main \
            --commit-hash="$PAYMO_SHA" \
            --commit-message="$PAYMO_MESSAGE"
      - name: Verify Paymo production
        shell: bash
        run: |
          set -euo pipefail
          expected_integrity="$(sha256sum paymo/app/public/paymo-integrity-fixes.js | awk '{print $1}')"
          expected_paid="$(sha256sum paymo/app/public/paymo-paid.js | awk '{print $1}')"
          expected_items="$(sha256sum paymo/app/public/paymo-items.js | awk '{print $1}')"
          expected_category_spend="$(sha256sum paymo/app/public/paymo-category-spend.js | awk '{print $1}')"
          expected_monthly="$(sha256sum paymo/app/public/paymo-monthly-summary-notifications.js | awk '{print $1}')"
          expected_graph_detail="$(sha256sum paymo/app/public/paymo-graph-detail.js | awk '{print $1}')"
          expected_graph_edit="$(sha256sum paymo/app/public/paymo-graph-detail-edit.js | awk '{print $1}')"
          expected_graph_size="$(sha256sum paymo/app/public/paymo-graph-detail-size.js | awk '{print $1}')"
          expected_mobile="$(sha256sum paymo/app/public/paymo-mobile-ui.js | awk '{print $1}')"
          expected_nav_scroll="$(sha256sum paymo/app/public/paymo-nav-scroll-top.js | awk '{print $1}')"
          for i in $(seq 1 20); do
            ts=$(date +%s)
            html_status="$(curl -sS --max-time 10 -o /tmp/paymo-index.html -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/?ts=$ts" || true)"
            integrity_status="$(curl -sS --max-time 10 -o /tmp/paymo-integrity-fixes.js -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-integrity-fixes.js?ts=$ts" || true)"
            paid_status="$(curl -sS --max-time 10 -o /tmp/paymo-paid.js -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-paid.js?ts=$ts" || true)"
            items_status="$(curl -sS --max-time 10 -o /tmp/paymo-items.js -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-items.js?ts=$ts" || true)"
            category_spend_status="$(curl -sS --max-time 10 -o /tmp/paymo-category-spend.js -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-category-spend.js?ts=$ts" || true)"
            monthly_file_status="$(curl -sS --max-time 10 -o /tmp/paymo-monthly-summary-notifications.js -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-monthly-summary-notifications.js?ts=$ts" || true)"
            graph_detail_status="$(curl -sS --max-time 10 -o /tmp/paymo-graph-detail.js -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-graph-detail.js?ts=$ts" || true)"
            graph_edit_status="$(curl -sS --max-time 10 -o /tmp/paymo-graph-detail-edit.js -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-graph-detail-edit.js?ts=$ts" || true)"
            graph_size_status="$(curl -sS --max-time 10 -o /tmp/paymo-graph-detail-size.js -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-graph-detail-size.js?ts=$ts" || true)"
            mobile_status="$(curl -sS --max-time 10 -o /tmp/paymo-mobile-ui.js -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-mobile-ui.js?ts=$ts" || true)"
            nav_scroll_status="$(curl -sS --max-time 10 -o /tmp/paymo-nav-scroll-top.js -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-nav-scroll-top.js?ts=$ts" || true)"
            auth_status="$(curl -sS --max-time 10 -o /tmp/paymo-me.json -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/api/me?ts=$ts" || true)"
            monthly_api_status="$(curl -sS --max-time 10 -o /tmp/paymo-monthly-api.json -w '%{http_code}' -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/api/monthly-summary-settings?ts=$ts" || true)"
            echo "attempt=$i html=$html_status integrity=$integrity_status paid=$paid_status items=$items_status category_spend=$category_spend_status monthly_file=$monthly_file_status graph_detail=$graph_detail_status graph_edit=$graph_edit_status graph_size=$graph_size_status mobile=$mobile_status nav_scroll=$nav_scroll_status auth=$auth_status monthly_api=$monthly_api_status"
            if [ "$html_status" = "200" ] \
              && [ "$integrity_status" = "200" ] \
              && [ "$paid_status" = "200" ] \
              && [ "$items_status" = "200" ] \
              && [ "$category_spend_status" = "200" ] \
              && [ "$monthly_file_status" = "200" ] \
              && [ "$graph_detail_status" = "200" ] \
              && [ "$graph_edit_status" = "200" ] \
              && [ "$graph_size_status" = "200" ] \
              && [ "$mobile_status" = "200" ] \
              && [ "$nav_scroll_status" = "200" ] \
              && [ "$auth_status" = "401" ] \
              && [ "$monthly_api_status" = "401" ] \
              && [ "$(sha256sum /tmp/paymo-integrity-fixes.js | awk '{print $1}')" = "$expected_integrity" ] \
              && [ "$(sha256sum /tmp/paymo-paid.js | awk '{print $1}')" = "$expected_paid" ] \
              && [ "$(sha256sum /tmp/paymo-items.js | awk '{print $1}')" = "$expected_items" ] \
              && [ "$(sha256sum /tmp/paymo-category-spend.js | awk '{print $1}')" = "$expected_category_spend" ] \
              && [ "$(sha256sum /tmp/paymo-monthly-summary-notifications.js | awk '{print $1}')" = "$expected_monthly" ] \
              && [ "$(sha256sum /tmp/paymo-graph-detail.js | awk '{print $1}')" = "$expected_graph_detail" ] \
              && [ "$(sha256sum /tmp/paymo-graph-detail-edit.js | awk '{print $1}')" = "$expected_graph_edit" ] \
              && [ "$(sha256sum /tmp/paymo-graph-detail-size.js | awk '{print $1}')" = "$expected_graph_size" ] \
              && [ "$(sha256sum /tmp/paymo-mobile-ui.js | awk '{print $1}')" = "$expected_mobile" ] \
              && [ "$(sha256sum /tmp/paymo-nav-scroll-top.js | awk '{print $1}')" = "$expected_nav_scroll" ] \
              && grep -Fq '/paymo-integrity-fixes.js' /tmp/paymo-index.html \
              && grep -Fq '/paymo-monthly-summary-notifications.js' /tmp/paymo-index.html \
              && grep -Fq 'paymoIntegrityStatus' /tmp/paymo-integrity-fixes.js \
              && grep -Fq 'primeLegacyHistoryTargets' /tmp/paymo-integrity-fixes.js \
              && grep -Fq 'history-delete-confirm-backdrop{z-index:950' /tmp/paymo-integrity-fixes.js \
              && grep -Fq 'sameAmountAndDate' /tmp/paymo-integrity-fixes.js \
              && grep -Fq 'overdueItems' /tmp/paymo-paid.js \
              && grep -Fq "category-history-row.is-paid .category-history-amount{color:#22a559!important}" /tmp/paymo-category-spend.js \
              && grep -Fq 'paymoMonthlySummaryEnabled' /tmp/paymo-monthly-summary-notifications.js \
              && grep -Fq 'paymoGraphDetailToggleView' /tmp/paymo-graph-detail.js \
              && grep -Fq 'usageDateGroups' /tmp/paymo-graph-detail.js \
              && grep -Fq 'dateGrouped' /tmp/paymo-graph-detail-edit.js \
              && grep -Fq 'paymo-graph-detail-rotate-icon' /tmp/paymo-graph-detail.js \
              && grep -Fq 'M11.8 25.4C15.2 14.1' /tmp/paymo-graph-detail.js \
              && grep -Fq 'M52.2 38.4C49 49.8' /tmp/paymo-graph-detail.js \
              && grep -Fq '<span>支出日</span><span>支払期日</span><span>項目名</span><span>金額</span>' /tmp/paymo-graph-detail-edit.js \
              && grep -Fq 'grid-template-columns:48px 62px minmax(0,1fr) 94px' /tmp/paymo-graph-detail-size.js \
              && grep -Fq 'overscroll-behavior-y:none' /tmp/paymo-mobile-ui.js \
              && grep -Fq 'overflow:hidden!important' /tmp/paymo-mobile-ui.js \
              && grep -Fq "const scroller = document.querySelector('.app')" /tmp/paymo-nav-scroll-top.js; then
              echo "Paymo production verified: double clockwise arrow icon and four-column date detail."
              exit 0
            fi
            sleep 5
          done
          echo "Paymo production verification failed."
          exit 1
